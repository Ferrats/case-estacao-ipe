<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&amp;family=Source+Sans+3:wght@600&amp;display=swap');
    .eyebrow { font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 8px; fill: #D68A2D; }
    .word    { font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 68px; fill: #1E3F5C; }
  </style>

  <!-- symbol -->
  <g transform="translate(0,-14) scale(0.72)">
    <path d="M 50 194 L 50 108 A 70 70 0 0 1 190 108 L 190 194"
          fill="none" stroke="#1E3F5C" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#1E3F5C" stroke-width="5" stroke-linecap="round">
      <line x1="82" y1="198" x2="82" y2="210"/>
      <line x1="158" y1="198" x2="158" y2="210"/>
    </g>
    <path d="M 122 188 Q 110 150 121 112" fill="none" stroke="#1E3F5C" stroke-width="6" stroke-linecap="round"/>
    <circle cx="112" cy="97" r="12" fill="#D68A2D"/>
    <circle cx="130" cy="93" r="11" fill="#D68A2D"/>
    <circle cx="120" cy="112" r="13" fill="#D68A2D"/>
    <circle cx="138" cy="107" r="9" fill="#E4654A"/>
  </g>

  <!-- wordmark -->
  <text x="216" y="92" text-anchor="start" class="eyebrow">ESTAÇÃO</text>
  <text x="212" y="158" text-anchor="start" class="word">Ipê</text>
</svg>
